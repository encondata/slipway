# slipway.yml for ServerSherpa (BaseCampV3): copy to the root of the repository.
#
# One ServerSherpa environment on one Docker host, with its own PostgreSQL and
# SeaweedFS (the db and storage stacks). deploy/stack/ss-stack does the work;
# Slipway writes <instance folder>/shared/.env from deploy/stack/env.example and
# runs ss-stack from the release.
#
# Set other env.example values (SS_KIOSK_SIGNING_DIGESTS, SS_ANTHROPIC_API_KEY,
# SS_SMTP_HOST and the rest of the SS_SMTP_* keys...) as environment variables on
# the Slipway instance. With mailpit off, ss-stack needs SS_SMTP_HOST; learn needs wiki.
#
# The data section and the data commands let Slipway back up the database and the
# uploaded files before every change, restore them, reset them and seed new
# instances from snapshots. docs/manifest.md describes every key.
#
# Environments: data.migrations, data.attach and data.server let Slipway run
# ServerSherpa as Blue/Green app slots that share a data server (its db and
# storage stacks on a host of their own). An instance outside an environment
# ignores them and deploys exactly as above. docs/environments.md has the rest.
#
# DigitalOcean: edge and data.managed let Slipway run ServerSherpa on droplets
# behind a cloud load balancer, with a managed PostgreSQL cluster and a Spaces
# bucket. Caddy serves plain HTTP on :80 behind the load balancer, and the
# services bind to 127.0.0.1. Nothing else reads them.
version: 1
name: ServerSherpa
env_file: deploy/stack/env.example
placeholder: CHANGEME

settings:
  STACK_DOMAIN:
    label: Base domain
    help: The public names are <service>.<base domain>, such as portal.uat.serversherpa.com.
    example: uat.serversherpa.com
    required: true
  STACK_PROXY_IP:
    label: Proxy address
    help: The LAN address of Switchyard. Containers reach the public names through it, and the API trusts X-Forwarded-For only from it.
    example: 10.10.48.20
    required: true
  SS_LOG_LEVEL:
    label: Log level
    default: INFO

vars:
  STACK_ENV: "{slipway.slug}"
  STACK_REPO_DIR: "{slipway.release}"
  STACK_IMAGE_TAG: "{slipway.sha12}"

secrets:
  POSTGRES_PASSWORD: hex
  SPACES_SECRET_KEY: hex
  SS_JWT_SECRET: hex
  SS_TOTP_ENCRYPTION_KEY: {kind: fernet, identity: true}   # 2FA seeds in the database are encrypted with it
  SS_PASSWORD_PEPPER:     {kind: hex, identity: true}      # password hashes are peppered with it
  SS_WIKI_SERVICE_TOKEN: hex

# health: the path an environment's smoke tests request (default /).
services:
  api:     {port: 8000, port_var: STACK_API_PORT,     hostname: "api.{STACK_DOMAIN}", health: /healthz}
  portal:  {port: 8091, port_var: STACK_PORTAL_PORT,  hostname: "portal.{STACK_DOMAIN}"}
  spaces:  {port: 9000, port_var: STACK_SPACES_PORT,  hostname: "spaces.{STACK_DOMAIN}", health: /healthz}
  kiosk:   {port: 8090, port_var: STACK_KIOSK_PORT,   hostname: "kiosk.{STACK_DOMAIN}", optional: true}
  wiki:    {port: 8096, port_var: STACK_WIKI_PORT,    hostname: "wiki.{STACK_DOMAIN}", optional: true, health: /healthz}
  learn:   {port: 8092, port_var: STACK_LEARN_PORT,   hostname: "learn.{STACK_DOMAIN}", optional: true}
  status:  {port: 8095, port_var: STACK_STATUS_PORT,  hostname: "status.{STACK_DOMAIN}", optional: true, health: /healthz}
  mailpit: {port: 8025, port_var: STACK_MAILPIT_PORT, optional: true}

optional_services: {var: STACK_APPS, none: none}

projects:
  - "ss-{STACK_ENV}-db"
  - "ss-{STACK_ENV}-storage"
  - "ss-{STACK_ENV}-api"
  - "ss-{STACK_ENV}-web"
  - "ss-{STACK_ENV}-status"

# What ss-stack build makes for a release; Slipway removes them with the release.
images:
  - "serversherpa-api:{STACK_IMAGE_TAG}"
  - "serversherpa-portal:{STACK_IMAGE_TAG}"
  - "serversherpa-kiosk:{STACK_IMAGE_TAG}"
  - "serversherpa-wiki:{STACK_IMAGE_TAG}"
  - "serversherpa-learn:{STACK_IMAGE_TAG}"
  - "serversherpa-status:{STACK_IMAGE_TAG}"

# Behind a cloud load balancer (DigitalOcean): Caddy on :80, the services on 127.0.0.1.
# A setting named in env (STACK_PROXY_IP) takes this value there and isn't asked for.
edge:
  port: 80
  health: /healthz
  env:
    STACK_CADDY: "1"
    STACK_NETWORK_SUBNET: 172.30.0.0/24
    STACK_PROXY_IP: 172.30.0.2
    STACK_BIND_IP: 127.0.0.1
    STACK_HOSTS_IP: "{edge.address}"
    STACK_TRUSTED_PROXIES: "{edge.trusted}"
  projects: ["ss-{STACK_ENV}-proxy"]

data:
  app: serversherpa                       # never change it: snapshots seed only an app with the same id
  format: pg-custom                       # pg_dump -Fc --no-owner --no-acl (ss-stack pgdump)
  volumes:
    - {name: "ss-{STACK_ENV}-db_pgdata",           holds: database}
    - {name: "ss-{STACK_ENV}-storage_seaweeddata", holds: files}
    - {name: "ss-{STACK_ENV}-status_status-data",  holds: other}
  files: {format: serversherpa-objects-v1, label: Uploaded files}
  identity_label: sign-in keys
  identity_help: People sign in with the passwords and 2FA codes they had when the data was made.
  # api/migrations add columns and tables first and remove them in a later release, so the release
  # before runs on the schema the next one migrates (needed for two app slots).
  migrations: expand_contract
  # An app slot whose data is on the data server: these .env keys point it there.
  attach:
    needs: {db: postgres, objects: s3}
    env:
      STACK_EXTERNAL_DATA: "1"
      STACK_DB_HOST: "{data.db.host}"
      STACK_DB_PORT: "{data.db.port}"
      STACK_DB_NAME: "{data.db.database}"
      STACK_DB_USER: "{data.db.user}"
      STACK_DB_SSLMODE: "{data.db.tls}"
      SS_DATABASE_URL: "postgresql+asyncpg://{data.db.user}:{data.db.password}@{data.db.host}:{data.db.port}/{data.db.database}"
      SS_DATABASE_SSL: "{data.db.tls}"
      SS_DATABASE_CA_B64: "{data.db.ca_b64}"
      SS_SPACES_ENDPOINT: "{data.objects.endpoint}"
      SS_SPACES_REGION: "{data.objects.region}"
      SS_SPACES_ACCESS_KEY: "{data.objects.access_key}"
      SS_SPACES_SECRET_KEY: "{data.objects.secret_key}"
      SS_SPACES_USE_PATH_STYLE: "{data.objects.path_style}"
  # The data server: only the db and storage stacks, with Postgres published to the app slots' hosts.
  server:
    services: [spaces]
    ports: {db: {port: 5432, port_var: STACK_DB_PORT}}
    secrets: [POSTGRES_PASSWORD, SPACES_SECRET_KEY]   # every other secret is written empty there
    env: {STACK_DB_PUBLISH: "1", STACK_DB_ALLOW: "{server.clients}"}
    projects: ["ss-{STACK_ENV}-db", "ss-{STACK_ENV}-storage"]
    volumes: ["ss-{STACK_ENV}-db_pgdata", "ss-{STACK_ENV}-storage_seaweeddata"]
    commands:
      start:    [deploy/stack/ss-stack, data, "{slipway.env_dir}"]
      has_data: [deploy/stack/ss-stack, has-data, "{slipway.env_dir}", --server]
    provides:
      db: {host: "{server.host}", port: "{server.port.db}", database: serversherpa, user: serversherpa,
           password: "{secret.POSTGRES_PASSWORD}", tls: disable, ca_b64: ""}
      objects: {endpoint: "https://spaces.{STACK_DOMAIN}", region: us-east-1, bucket: "{SS_SPACES_BUCKET}",
                access_key: serversherpa, secret_key: "{secret.SPACES_SECRET_KEY}", path_style: "true"}
  # Managed data (DigitalOcean): a PostgreSQL cluster and a Spaces bucket in place of the db and storage stacks.
  managed:
    skip: [spaces]
    db:      {version: "16", database: serversherpa, user: serversherpa, password: "{secret.POSTGRES_PASSWORD}"}
    objects: {cors: [portal, kiosk, wiki]}
    env:
      SS_SPACES_BUCKET: "{data.objects.bucket}"   # the env_file's default is "serversherpa"; Spaces names are global
    commands:
      has_data: [deploy/stack/ss-stack, has-data, "{slipway.env_dir}", --external]

commands:
  build:        [deploy/stack/ss-stack, build, "{slipway.env_dir}"]
  start:        [deploy/stack/ss-stack, up, "{slipway.env_dir}"]
  stop:         [deploy/stack/ss-stack, down, "{slipway.env_dir}"]
  has_data:     [deploy/stack/ss-stack, has-data, "{slipway.env_dir}"]
  data_up:      [deploy/stack/ss-stack, data, "{slipway.env_dir}"]
  # pgdump, not dump: dump names and prunes its own files, and Slipway does that here.
  dump:         [deploy/stack/ss-stack, pgdump, "{slipway.env_dir}", "{slipway.out}"]
  verify_dump:  [deploy/stack/ss-stack, verify-dump, "{slipway.env_dir}", "{slipway.in}"]
  revision:     [deploy/stack/ss-stack, revision, "{slipway.env_dir}"]
  accepts:      [deploy/stack/ss-stack, accepts, "{slipway.env_dir}", "{slipway.in}"]
  restore:      [deploy/stack/ss-stack, restore, "{slipway.env_dir}", "{slipway.in}"]
  export_files: [deploy/stack/ss-stack, export-objects, "{slipway.env_dir}", "{slipway.out}"]
  import_files: [deploy/stack/ss-stack, import-objects, "{slipway.env_dir}", "{slipway.in}"]
  after_import: [deploy/stack/ss-stack, clear-sessions, "{slipway.env_dir}"]
  seed:         [deploy/stack/ss-stack, seed, "{slipway.env_dir}"]

# ss-stack admin runs serversherpa bootstrap-admin itself.
first_admin:
  help: The first deploy creates this person as ServerSherpa's first super admin. The password is never emailed.
  command: [deploy/stack/ss-stack, admin, "{slipway.env_dir}", --email, "{admin.email}",
            --first-name, "{admin.first_name}", --last-name, "{admin.last_name}",
            --role, super_admin, --link-minutes, "240"]
  fields:
    first_name: {label: First name, max: 100}
    last_name:  {label: Last name, max: 100}
    email:      {label: Email, kind: email}
  password: {min_length: 8, stdin: true, args: [--password-stdin]}
  invite:   {label: Email them a link to set their password, args: [--invite]}
  done_codes: [0]
  exists_codes: [10]
  messages:
    2: ServerSherpa refused the request (usage error); see the log.
    3: The password is shorter than ServerSherpa's password policy allows.
    4: ServerSherpa has no global role super_admin.
    5: ServerSherpa can't send email, so it can't send an invite. Set a password instead, or configure SS_SMTP_HOST (or turn on mailpit).
    6: ServerSherpa failed while creating the account; see the api container's logs.
    7: A person with that email exists in ServerSherpa without an account; give them one in the portal, or use another email.
    8: ServerSherpa refused the email address (it refuses .local and .test domains).

# Minutes; the rest keep Slipway's defaults.
timeouts: {restore: 120, export_files: 120, import_files: 120}
